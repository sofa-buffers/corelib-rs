[package]
name = "sofa-buffers-corelib"
# 0.13.0, not 0.12.x: under Cargo's 0.x semantics a 0.12.x release must stay
# API-compatible with 0.12.0, and this one is not — the `sofab::seq::SeqVec`
# trait gains a required `truncate(&mut self, len)` (`clear` becomes a provided
# method defaulting to `truncate(0)`), so a third-party `SeqVec` impl must add it.
version = "0.13.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "SofaBuffers (Sofab) — compact, streaming serialization core tuned for speed on big machines: zero-copy contiguous decoding (advance-a-pointer), an allocation-free codec, visitor-driven streaming decode. Wire-compatible with every corelib-* port."
repository = "https://github.com/sofa-buffers/corelib-rs"
keywords = ["serialization", "varint", "streaming", "zero-copy", "protobuf"]
categories = ["encoding", "parsing", "network-programming"]

# The crate is published on crates.io as `sofa-buffers-corelib` (the name users
# add to their `Cargo.toml`), but the importable namespace is `sofab` —
# `use sofab::…`. This matches the language-independent API contract
# (CORELIB_PLAN §6).
[lib]
name = "sofab"

[dev-dependencies]
# Process CPU time (clock_gettime) for the runtime benchmarks, so throughput is
# measured against CPU time rather than wall-clock — matching the C/C++ tools.
libc = "0.2"

# Parse the shared `assets/test_vectors.json` (the cross-language source of
# truth) in the conformance test suite. Test-only.
serde_json = "1"

# Per-op cost: cycles/op (hardware cycle counter) + throughput MB/s, over a
# ~1s CPU-time loop. Mirrors corelib-c-cpp bench/perf.
[[bench]]
name = "perf"
harness = false

# Throughput speedtest: MB/s table over a ~1s CPU-time loop per workload.
[[bench]]
name = "bench"
harness = false

# No wire-format feature flags: every wire type is always compiled in and the
# scalar value type is always 64-bit. This is the high-speed build — it does not
# trade wire-type granularity or value range for footprint.
#
# The features add a container, not wire code: `heapless` implements
# `sofab::seq::SeqVec` for `heapless::Vec<T, N>`, so a generated crate that
# holds a schema-bounded wrapper array in fixed-capacity storage
# (sofabgen `rust.allow_dynamic: false`) routes it through the same `seq`
# helpers as a `Vec`. The trait lives here, so the impl has to as well.
#
# One feature per heapless major, because a `heapless::Vec` of 0.8 and one of
# 0.9 are different types: `heapless` is 0.8, `heapless09` is 0.9 (a renamed
# dependency, so both can be on at once). heapless 0.9 needs rustc 1.87; the
# crate's MSRV of 1.70 holds for every build that leaves `heapless09` off.
[features]
heapless = ["dep:heapless"]
heapless09 = ["dep:heapless09"]

[dependencies]
heapless = { version = "0.8", optional = true, default-features = false }
heapless09 = { package = "heapless", version = "0.9", optional = true, default-features = false }

# ---------------------------------------------------------------------------
# Speed-optimized release profile (the whole point of this port). The opposite
# of the no_std crate's size-tuned `opt-level = "z"`: here we want the fastest
# code the compiler can produce. For the last few percent, build benchmarks with
# `RUSTFLAGS="-C target-cpu=native"`.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Benchmark profile: -O3 + fat LTO for a fair comparison with the C/C++ -O3
# builds. Keep debug info so `perf`/Callgrind can attribute cost.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
