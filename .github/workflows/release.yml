name: Release

# Publish `sofa-buffers-corelib` to crates.io when a GitHub Release is published.
#
# The git tag is the source of truth for the version — but unlike npm, Cargo
# cannot be handed one at publish time: `cargo publish` reads the version out of
# Cargo.toml and bakes it into the artifact. So the guard *compares* tag and
# manifest and refuses a mismatch, rather than injecting the tag.
#
# Every check sits before the upload on purpose: a crates.io version can never
# be replaced or deleted, only yanked — and a yanked version still serves every
# lockfile that already references it. There is no second chance to get 0.11.0
# right.
#
# `workflow_dispatch` runs the identical pipeline against an existing tag as a
# rehearsal and stops short of the publish, so the machinery can be exercised
# without spending a version number.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rehearse against (e.g. v0.11.0). Runs every check, publishes nothing."
        required: true
        type: string

permissions:
  contents: read

# One release at a time; never cancel a run that may already have uploaded.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATE: sofa-buffers-corelib

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can be decided without a build, decided first: a bad tag or
  # a version that is already taken should cost seconds, not a full matrix.
  # ---------------------------------------------------------------------------
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve the version from the tag
        id: resolve
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Plain semver, optional prerelease / build metadata. A malformed tag
          # must surface here rather than inside `cargo publish`.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not resolve to a valid semver version ('$VERSION')."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "ref=$TAG"
            echo "publish=${{ github.event_name == 'release' }}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag $TAG)"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0   # the ancestry notice below needs history

      # `cargo metadata` rather than a grep: it reads the manifest the way Cargo
      # will, so a version behind a workspace inheritance or a comment cannot
      # fool the comparison. Ubuntu runners ship a Rust toolchain, so this job
      # needs no toolchain setup of its own.
      - name: Manifest must agree with the tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          META="$(cargo metadata --no-deps --format-version 1)"
          NAME="$(jq -r '.packages[0].name' <<<"$META")"
          MANIFEST_VERSION="$(jq -r '.packages[0].version' <<<"$META")"

          if [ "$NAME" != "$CRATE" ]; then
            echo "::error::Cargo.toml publishes '$NAME', but this workflow guards '$CRATE'."
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml is at $MANIFEST_VERSION but the tag says $VERSION. Cargo publishes the manifest version — bump Cargo.toml, commit, and re-tag."
            exit 1
          fi
          echo "$NAME $MANIFEST_VERSION matches tag."

      - name: Refuse a version that already exists on crates.io
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # 200 = this exact version is published; 404 = free (also the answer
          # for a crate that does not exist yet, which is the first release).
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
                    -H "User-Agent: $CRATE release workflow (github.com/${GITHUB_REPOSITORY})" \
                    "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          case "$CODE" in
            404) echo "$CRATE $VERSION is free — clear to publish." ;;
            200) echo "::error::$CRATE $VERSION is already on crates.io. A published version is immutable; bump and re-tag."; exit 1 ;;
            *)   echo "::error::crates.io answered HTTP $CODE for $CRATE/$VERSION — refusing to guess."; exit 1 ;;
          esac

      # Not a gate: a hotfix release off a maintenance branch is legitimate.
      # But a tag that is on *no* mainline is nearly always an accident, and it
      # should be visible in the log rather than discovered afterwards.
      - name: Note where the tag sits
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            echo "Tagged commit is on main."
          else
            echo "::warning::The tagged commit is not an ancestor of main — releasing off-mainline."
          fi

  # ---------------------------------------------------------------------------
  # The quality gate, and the only one: `ci.yml` already ran fmt, clippy, the
  # toolchain matrix, the release-profile suite, the MSRV build and the s390x
  # big-endian leg. Re-running any of that here would prove nothing new and
  # would be a second copy of a list that drifts — so this job asserts instead
  # that CI actually ran, and passed, on this *exact* commit. That matters
  # because a release tag can point at any commit, while CI triggers on pushes
  # to main and on pull requests.
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI passed on this commit
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.ref }}
      - name: Require a successful CI run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATING_WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          # A workflow that was renamed or folded into another file answers 404
          # here. Saying so is the point: silently reading that as "no successful
          # run" would tell a maintainer to re-run something that no longer
          # exists. The twin repo lost three workflow files exactly that way.
          if ! RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$GATING_WORKFLOW/runs?head_sha=$SHA" 2>&1)"; then
            echo "::error::cannot read runs for '$GATING_WORKFLOW' — renamed or removed? Then GATING_WORKFLOW in this file is stale. ($RUNS)"
            exit 1
          fi
          CONCLUSIONS="$(jq -r '.workflow_runs[] | select(.status == "completed") | .conclusion' <<<"$RUNS")"
          echo "CI runs for $SHA: ${CONCLUSIONS:-<none>}"
          if grep -qx success <<<"$CONCLUSIONS"; then
            echo "CI is green on the tagged commit."
          else
            echo "::error::No successful CI run for $SHA. Push the commit to main (or open a PR for it), let CI finish, then re-cut the release."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The artifact, not the working tree. `cargo package` builds the exact file
  # set that would go to crates.io and verifies it compiles; the smoke step then
  # consumes that extracted package from *outside* the repository, as an
  # ordinary dependency, and runs a round trip through the public API. A source
  # file missing from the package, or an item that only resolves via a
  # dev-dependency, fails here — and nowhere else in this pipeline.
  # ---------------------------------------------------------------------------
  package-smoke:
    name: Package & smoke
    needs: guard
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.ref }}
      - uses: ./.github/actions/rust

      - name: Package (builds and verifies the .crate)
        run: cargo package --verbose

      - name: What the package contains
        run: cargo package --list

      # `.github/smoke/run.sh` builds a throwaway crate outside the repository
      # against the given dependency spec and runs the round trip in
      # `.github/smoke/roundtrip.rs`. The same script is used again after the
      # publish with a registry dependency, so both halves test one thing.
      - name: Smoke-test the packaged crate as a dependency
        run: |
          set -euo pipefail
          PKG="$PWD/target/package/$CRATE-$VERSION"
          test -d "$PKG" || { echo "::error::$PKG missing — did cargo package change its layout?"; exit 1; }
          .github/smoke/run.sh "path = \"$PKG\""

      - name: Upload the .crate for inspection
        uses: actions/upload-artifact@v7
        with:
          name: crate-${{ env.VERSION }}
          path: target/package/*.crate
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish. Trusted Publishing (OIDC) instead of a long-lived CRATES_IO_TOKEN:
  # the runner mints a short-lived id-token that crates.io exchanges for a
  # one-off publish credential. Configured once on crates.io under the crate's
  # Settings -> Trusted Publishing (this repository + `release.yml` +
  # environment `crates-io`).
  #
  # crates.io can only be told about a crate that already exists, so the *first*
  # version of each crate is published by hand (`cargo publish` with a personal
  # token); from the second on, this job is the only publisher.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: [guard, ci-status, package-smoke]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: crates-io
      url: https://crates.io/crates/sofa-buffers-corelib
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.ref }}
      - uses: ./.github/actions/rust

      - name: Mint a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --verbose

  # ---------------------------------------------------------------------------
  # The same smoke test again, but against what the registry actually serves.
  # Everything above tests a local artifact; only this proves the upload landed
  # intact and is installable by a stranger.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify from crates.io
    needs: [guard, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.ref }}
      - uses: ./.github/actions/rust

      # Wait for the sparse index — the file Cargo itself resolves against —
      # rather than retrying the smoke test until it happens to work: a retry
      # loop around the whole check would bury a genuine failure under minutes
      # of "not yet".
      - name: Wait for the index to carry the new version
        run: |
          set -euo pipefail
          # Sparse-index layout: names of four characters or more live under
          # <first two>/<next two>/<name>.
          INDEX="https://index.crates.io/so/fa/$CRATE"
          for attempt in $(seq 1 30); do
            # Fetch into a variable rather than piping into `grep -q`: `-q`
            # closes the pipe on the first match and curl dies of SIGPIPE,
            # which `pipefail` would turn into a false negative.
            entries="$(curl -sS -H "User-Agent: $CRATE release workflow (github.com/${GITHUB_REPOSITORY})" "$INDEX" || true)"
            if grep -q "\"vers\":\"$VERSION\"" <<<"$entries"; then
              echo "index carries $VERSION."
              exit 0
            fi
            echo "attempt $attempt: index has no $VERSION yet — waiting"
            sleep 10
          done
          echo "::error::$CRATE $VERSION never appeared in the sparse index. The publish reported success, so check crates.io before re-running."
          exit 1

      - name: Install the published version and round-trip through it
        run: .github/smoke/run.sh "version = \"=$VERSION\""
