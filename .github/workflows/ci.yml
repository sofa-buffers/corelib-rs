name: CI

# CORELIB_PLAN §13's "CI builds and tests on push and PR", as two triggers:
# `pull_request` gates a change before it lands, and the push leg proves main
# itself is green afterwards (it is also the leg that publishes the coverage
# badge). The push leg deliberately watches main only — with `pull_request` on,
# also building every topic-branch push would compile each commit of an open PR
# twice, and a branch without a PR is covered the moment one opens.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per branch: a new push supersedes the old one everywhere
# except on main, whose runs publish the coverage badge and are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Every job below carries an explicit `timeout-minutes`, sized at roughly four
# times its observed runtime. A hung step has to fail fast and say which job it
# was: the account gets 20 concurrent Actions slots, so a job wedged on
# GitHub's 6-hour default holds a slot that every other repo in the family is
# queuing for.
jobs:
  # Formatting, clippy and rustdoc, denying all warnings.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

      # The Pages workflow (`docs.yml`) builds rustdoc with warnings denied, but
      # only on push to main — so a broken intra-doc link was discovered after
      # the merge that introduced it, with main already red. The identical check
      # runs here, where it still blocks the PR.
      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  # Build + full test suite against stable compilers only — no beta, no nightly.
  #   stable             = whatever is current on the day the job runs
  #   1.97 / 1.96 / 1.95 = the three most recent releases, pinned
  test:
    name: Test (${{ matrix.toolchain }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["stable", "1.97", "1.96", "1.95"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo build --release --verbose
      - run: cargo test --verbose

      # State what the shared-vector suite ran. `cargo test` captures stdout for
      # passing tests, so the vector target is replayed with `--nocapture` to put
      # the vector and check counts — including the 58 vectors carrying
      # `skip_ids` and the 36-vector skip matrix (CORELIB_PLAN §7.1, §7.2 item 7)
      # — into the CI log. The step re-runs the binary the line above already
      # built; it compiles nothing.
      - name: Shared test vectors (vector and check counts)
        run: cargo test --test vectors_tests -- --nocapture

  # The same suite against the build users actually link against. `cargo test`
  # on its own only ever asserts on the unoptimized artifact, and this port's
  # correctness arguments are optimizer-visible: the varint reader's unchecked
  # unaligned loads, `push_byte`'s `get_unchecked_mut` and
  # `write_varint_unchecked`'s eight-byte store for a one-byte varint all sit
  # behind guards the inliner can see through. `--release` compiles the test
  # targets with `[profile.release]`'s opt-level 3 / fat LTO / single codegen
  # unit (CORELIB_PLAN §12.1, steps 4-5). Stable only — the pinned-toolchain
  # legs above already prove the release *build* compiles on each of them.
  test-release:
    name: Test (release profile)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - run: cargo test --release --verbose

  # The MSRV declared in Cargo.toml (`rust-version`). Library-only: the dev-
  # dependency tree (serde_json -> zmij) needs 1.71+, so `cargo test` can't run
  # this far back — the MSRV promise covers what users compile, not our tests.
  msrv:
    name: Build (MSRV 1.70)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          toolchain: "1.70"
      - run: cargo build --release --verbose

  # Same suite on a big-endian host (IBM Z / s390x) under QEMU, proving the
  # little-endian wire format round-trips correctly off little-endian hardware.
  test-big-endian:
    name: Test (big-endian, s390x)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@cross
      - run: cross test --target s390x-unknown-linux-gnu --verbose

  # Line coverage via llvm-cov; publishes the README's coverage badge from main.
  coverage:
    name: Coverage
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # push the badge JSON to the `badges` branch
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only --json --output-path coverage.json
          PCT=$(jq '.data[0].totals.lines.percent' coverage.json)
          printf 'line coverage: %.1f%%\n' "$PCT"
          echo "COVERAGE_PCT=$PCT" >> "$GITHUB_ENV"

      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-coverage-badge.sh
